<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOAN Hive | Wiki 2026 Preview</title><style>
:root{--navy:#123650;--blue:#236b9c;--ice:#eaf4fb;--ink:#21384b;--muted:#688094;--line:#e1e9ef;--bg:#f6f9fc;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}aside{position:fixed;width:248px;background:white;border-right:1px solid var(--line);height:100vh;padding:28px 15px;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:5px 13px 26px}.mark{width:38px;height:38px;border-radius:12px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:21px}.brand b{display:block;line-height:1.15;font-size:16px}.brand small{font-size:11px;letter-spacing:1.2px;color:var(--muted)}.navlabel{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#9aa9b7;padding:10px 12px;margin-top:12px}.nav{display:block;width:100%;background:transparent;border:0;text-align:left;border-radius:9px;color:#516b7e;padding:11px 12px;margin:2px 0}.nav:hover,.nav.active{background:#eaf4fb;color:#125785;font-weight:700}.bottom{margin-top:26px;padding:15px;background:#eef6fb;border-radius:12px;font-size:12px;color:#527083}.shell{margin-left:248px;min-height:100vh}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(25px,5vw,80px);background:rgba(255,255,255,.86);border-bottom:1px solid var(--line)}.crumb{font-size:13px;color:#7690a4}.pill{font-size:11px;background:#fff0d6;color:#8d631d;border:1px solid #f4dbac;border-radius:100px;padding:6px 11px;font-weight:700}.main{max-width:1150px;margin:auto;padding:35px clamp(24px,5vw,70px) 80px}.hero{border-radius:21px;background:linear-gradient(122deg,#123650,#287ba8);padding:37px 42px;color:white;display:flex;justify-content:space-between;gap:20px;overflow:hidden;position:relative}.hero h1{font-size:clamp(30px,4.3vw,48px);line-height:1.12;margin:6px 0 12px;letter-spacing:-1px}.hero p{color:#dbeefa;max-width:570px;margin:0}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:#96d9fa}.bee{font-size:105px;transform:rotate(-12deg);align-self:center;filter:drop-shadow(0 12px 12px #09283c50)}.sectiontitle{margin:34px 0 15px;display:flex;align-items:center;justify-content:space-between;gap:15px}.sectiontitle h2{font-size:21px;margin:0;letter-spacing:-.4px}.sectiontitle span{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid var(--line);border-radius:15px;padding:22px;background:white;box-shadow:0 2px 8px #183b5405}.go{cursor:pointer;text-align:left;transition:.15s}.go:hover{border-color:#76b5d9;transform:translateY(-2px);box-shadow:0 8px 25px #183b5412}.card .emoji{font-size:24px;display:block;margin-bottom:14px}.card h3{margin:0 0 5px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:13px}.row{display:grid;grid-template-columns:1.5fr 1fr;gap:17px}.soft{background:#eaf4fb;border-color:#d4e9f7}.mini-list{padding:0;margin:12px 0 0;list-style:none}.mini-list li{padding:10px 0;border-bottom:1px solid #dfebf3;font-size:13px}.mini-list li:last-child{border:0}.tag{font-size:10px;font-weight:700;color:#876326;background:#f9eccf;border-radius:7px;padding:4px 7px;margin-left:6px;display:inline-block}.tag.blue{background:#e4f2fb;color:#236b9c}.button{background:var(--navy);color:white;border:0;padding:10px 15px;border-radius:9px;font-weight:700;font-size:12px}.lightbutton{background:white;border:1px solid #c7dfeb;color:#216693}.search{border:1px solid var(--line);padding:12px 15px;background:white;border-radius:11px;width:100%;outline:none;margin:0 0 18px}.search:focus{border-color:#3c91ba}.page-intro{max-width:800px;color:var(--muted);margin:0 0 24px}.profile{display:flex;align-items:flex-start;gap:15px}.avatar{width:58px;height:58px;border-radius:16px;background:#e1f1fa;display:grid;place-items:center;font-size:25px;flex-shrink:0}.profile h3{margin-bottom:1px}.profile small{color:#648197}.line{height:1px;background:var(--line);margin:18px 0}.notebox{border-left:4px solid #3e92bf;padding:15px 18px;background:#eef7fc;border-radius:0 10px 10px 0;color:#45647a;font-size:13px}.values{display:grid;grid-template-columns:1fr 1fr;gap:15px}.value{font-size:18px;font-weight:700}.foot{color:#8ba0b0;font-size:11px;margin-top:35px}.mobilebar{display:none}.hidden{display:none!important}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){aside{display:none;position:static;width:100%;height:auto;padding:10px}.shell{margin-left:0}.mobilebar{display:flex;gap:7px;overflow:auto;padding:12px;background:white}.mobilebar button{white-space:nowrap;border:1px solid var(--line);border-radius:9px;background:#f6f9fc;padding:8px 11px;color:#236b9c}.topbar{height:57px;padding:0 18px}.main{padding:20px 16px 45px}.hero{padding:27px}.bee{font-size:60px}.cards,.values,.row{grid-template-columns:1fr}}
</style></head><body><aside><div class="brand"><div class="mark">✦</div><div><b>SOAN HIVE</b><small>TEAM WIKI · 2026</small></div></div><div class="navlabel">YOUR WORKSPACE</div><button class="nav active" data-page="home">⌂ &nbsp; Home</button><button class="nav" data-page="culture">♡ &nbsp; Our Culture</button><button class="nav" data-page="team">♙ &nbsp; Meet the Team</button><button class="nav" data-page="essentials">▤ &nbsp; Employee Essentials</button><button class="nav" data-page="learning">▥ &nbsp; Learning Hub</button><button class="nav" data-page="tools">⚙ &nbsp; Tools & Resources</button><button class="nav" data-page="onboarding">✧ &nbsp; New Hire Corner</button><div class="bottom">✨ <b>Fresh look, same SOAN spirit.</b><br>Blue-theme concept preview.<br><br>Content under review is clearly marked.</div></aside><div class="shell"><div class="mobilebar"><button data-page="home">Home</button><button data-page="culture">Culture</button><button data-page="team">Team</button><button data-page="essentials">Essentials</button><button data-page="learning">Learning</button><button data-page="tools">Tools</button><button data-page="onboarding">New Hires</button></div><header class="topbar"><span class="crumb">Sum of All Numbers &nbsp; / &nbsp; <span id="breadcrumb">Home</span></span><span class="pill">DESIGN PREVIEW • NOT LIVE</span></header><main class="main" id="content"></main></div><script>
const blocks={home:`<div class="hero"><div><div class="eyebrow">WELCOME TO THE HIVE ✦</div><h1>Everything SOAN,<br>all in one place.</h1><p>Find the people, tools, policies, and resources that help us do our best work — together.</p></div><div class="bee" aria-hidden="true">🐝</div></div><div class="sectiontitle"><h2>Explore your Wiki</h2><span>Choose a section to explore →</span></div><div class="cards"><button class="card go" data-page="culture"><span class="emoji">💙</span><h3>Our Culture</h3><p>Our purpose, core values, and the story behind SOAN.</p></button><button class="card go" data-page="team"><span class="emoji">🌼</span><h3>Meet the Team</h3><p>People, personalities, team photos, and birthdays.</p></button><button class="card go" data-page="essentials"><span class="emoji">📋</span><h3>Employee Essentials</h3><p>Benefits, PTO, holidays, handbook, and travel.</p></button><button class="card go" data-page="learning"><span class="emoji">📖</span><h3>Learning Hub</h3><p>Courses, reading recommendations, and ProfitCon.</p></button><button class="card go" data-page="tools"><span class="emoji">💻</span><h3>Tools & Resources</h3><p>Double, the tech stack, our dictionary, and 1099s.</p></button><button class="card go" data-page="onboarding"><span class="emoji">🌱</span><h3>New Hire Corner</h3><p>Your starting point for life at SOAN.</p></button></div><div class="sectiontitle"><h2>Start here</h2></div><div class="row"><div class="card soft"><h3>✦ A little bit about us</h3><p>Our purpose is <b>Driving Entrepreneurs Toward Financial Peace.</b> Learn what we believe in and why we do what we do.</p><br><button class="button" data-page="culture">Explore SOAN's values →</button></div><div class="card"><h3>📌 Popular resources</h3><ul class="mini-list"><li>Employee benefits <span class="tag">Verify policy</span></li><li>Double training <span class="tag">Add links</span></li><li>1099 reference <span class="tag">To create</span></li></ul></div></div>`,culture:`<div class="eyebrow">WHAT MAKES US WHO WE ARE</div><h1>💙 Our Culture</h1><p class="page-intro">Our purpose and core values shape how we serve our clients and support one another.</p><div class="hero"><div><div class="eyebrow">OUR PURPOSE</div><h1>Driving Entrepreneurs<br>Toward Financial Peace.</h1><p>Also included in the current Wiki: giving women the freedom to make the choices they want with their lives.</p></div><div class="bee">✦</div></div><div class="sectiontitle"><h2>Our four core values</h2><span>From the existing Wiki</span></div><div class="values"><div class="card"><span class="emoji">🤝</span><div class="value">Only “A” Relationships</div><p>Core value 01</p></div><div class="card"><span class="emoji">📈</span><div class="value">Constant and Neverending Improvement</div><p>Core value 02</p></div><div class="card"><span class="emoji">🧭</span><div class="value">Choose the Right</div><p>Core value 03</p></div><div class="card"><span class="emoji">🔎</span><div class="value">Dig Deeper</div><p>Core value 04</p></div></div><div class="sectiontitle"><h2>Meet Holly & Michelle</h2></div><div class="notebox">Dedicated leadership introductions and photos will go here. Bios, roles, and fun facts need confirmation before publication.</div>`,team:`<div class="eyebrow">THE PEOPLE BEHIND THE NUMBERS</div><h1>🌼 Meet the Team</h1><p class="page-intro">A more personal directory with roles, photographs, and fun facts. The cards below demonstrate the intended look, not a verified roster.</p><input class="search" id="teamsearch" placeholder="Search a teammate or topic..."><div class="cards" id="teamcards"><div class="card person"><div class="profile"><div class="avatar">🌻</div><div><h3>Holly</h3><small>Role & headshot to confirm</small></div></div><div class="line"></div><p>🌷 <b>Fun fact concept:</b> Flower farming</p><span class="tag">Confirm before publishing</span></div><div class="card person"><div class="profile"><div class="avatar">🎹</div><div><h3>Michelle</h3><small>Role & headshot to confirm</small></div></div><div class="line"></div><p>🎭 <b>Fun fact concept:</b> Playing piano for Shakespeare productions</p><span class="tag">Confirm before publishing</span></div><div class="card person"><div class="profile"><div class="avatar">👋</div><div><h3>Your teammate here</h3><small>Department · Job title</small></div></div><div class="line"></div><p>✨ <b>Fun fact:</b> Something you wouldn't know from their job title!</p><span class="tag blue">Sample profile</span></div></div><div class="sectiontitle"><h2>More ways to connect</h2></div><div class="cards"><div class="card"><span class="emoji">🎂</span><h3>Team Birthdays</h3><p>Birthdays, displayed only with employees' permission.</p><span class="tag">Verify list</span></div><div class="card"><span class="emoji">🌏</span><h3>SOAN India</h3><p>Meet our India-based colleagues and learn about their roles.</p><span class="tag">Update roster</span></div><div class="card"><span class="emoji">📷</span><h3>Photo Wall</h3><p>ProfitCon memories and new team moments.</p><span class="tag">Collect photos</span></div></div>`,essentials:`<div class="eyebrow">ALL YOUR NEED-TO-KNOWS</div><h1>📋 Employee Essentials</h1><p class="page-intro">One clear home for employment policies and practical information. All policy details must be verified with the relevant owner.</p><div class="cards"><div class="card"><span class="emoji">🌴</span><h3>Benefits, PTO & 401(k)</h3><p>A combined hub with sections for paid time off, benefits, and retirement.</p><span class="tag">Pending review</span></div><div class="card"><span class="emoji">🗓️</span><h3>2026 Holiday Calendar</h3><p>Separate verified US and India observed holiday schedules.</p><span class="tag">Verify dates</span></div><div class="card"><span class="emoji">📘</span><h3>Employee Handbook</h3><p>Link to the current approved handbook, not the 2021 copy.</p><span class="tag">Request latest</span></div><div class="card"><span class="emoji">✈️</span><h3>Company Travel</h3><p>Approved reimbursement rules, booking expectations, and mileage policy.</p><span class="tag">Verify policy</span></div></div><div class="sectiontitle"><h2>Suggested page format</h2></div><div class="notebox"><b>Every policy page:</b> Summary · Who it applies to · How to request or use it · Official policy document · Policy owner · Last verified date.</div>`,learning:`<div class="eyebrow">GROWING TOGETHER</div><h1>📖 Learning Hub</h1><p class="page-intro">An organized learning center with a recommended reading shelf, continuing education, and conference takeaways.</p><div class="sectiontitle"><h2>Recommended Reading</h2><span>Preserved from the original Bookclub page</span></div><div class="cards"><div class="card"><span class="emoji">📕</span><h3>Delivering Happiness</h3><p>By Tony Hsieh</p><span class="tag blue">Original book</span></div><div class="card"><span class="emoji">📘</span><h3>Building a Non-Anxious Life</h3><p>By Dr. John Delony · Confirm exact title in existing records</p><span class="tag blue">Original reading pick</span></div><div class="card"><span class="emoji">➕</span><h3>More to Explore</h3><p>Move book recommendations here from Continued Education.</p><span class="tag">To migrate</span></div></div><div class="sectiontitle"><h2>Professional Development</h2></div><div class="cards"><div class="card"><span class="emoji">🎓</span><h3>Continued Education</h3><p>Courses, credentials, and professional education resources.</p></div><div class="card"><span class="emoji">🎤</span><h3>ProfitCon 2026</h3><p>Session highlights, photos, and takeaways from attendees.</p><span class="tag">Ask Michelle / Muskan</span></div></div>`,tools:`<div class="eyebrow">WORK SMARTER, TOGETHER</div><h1>💻 Tools & Resources</h1><p class="page-intro">One organized home for the systems, procedures, and reference materials the team uses every day.</p><div class="cards"><div class="card"><span class="emoji">✅</span><h3>Double</h3><p>Current workflow, tasks, month-end procedures, and training links.</p><span class="tag">Add approved SOPs</span></div><div class="card"><span class="emoji">🧰</span><h3>SOAN Tech Stack</h3><p>QuickBooks Online, Xero, Google Workspace, Zoom, Gusto, Slack, and other tools — verify all currently used apps.</p><span class="tag">Audit list</span></div><div class="card"><span class="emoji">🗂️</span><h3>SOAN Dictionary</h3><p>Common terms and acronyms, with Karbon-era definitions updated.</p><span class="tag">Needs update</span></div><div class="card"><span class="emoji">🧾</span><h3>1099 Reference</h3><p>General 1099 workflow, tools, deadlines, and account-specific exceptions.</p><span class="tag">New page</span></div></div><div class="sectiontitle"><h2>Training page idea</h2></div><div class="notebox"><b>For each tool:</b> What it is · What we use it for · Where to log in · Getting started video · Step-by-step SOPs · Who to ask for help.</div>`,onboarding:`<div class="eyebrow">YOU BELONG HERE</div><h1>🌱 New Hire Corner</h1><p class="page-intro">A welcoming first stop for everything a new teammate needs to begin with confidence.</p><div class="hero"><div><div class="eyebrow">WELCOME ABOARD</div><h1>We're glad you're here!</h1><p>Get to know SOAN, find your tools, and learn the basics of how we work.</p></div><div class="bee">👋</div></div><div class="sectiontitle"><h2>Your first stops</h2></div><div class="cards"><div class="card"><span class="emoji">①</span><h3>Get to Know SOAN</h3><p>Our purpose, values, and team members.</p></div><div class="card"><span class="emoji">②</span><h3>Get Your Tools</h3><p>Account setup, Tech Stack, Double, and communication.</p></div><div class="card"><span class="emoji">③</span><h3>Learn Our Workflows</h3><p>Training guides, reference pages, and key contacts.</p></div></div><div class="sectiontitle"><h2>A note about Moxie</h2></div><div class="notebox">SOAN and Moxie merged. Certain Moxie-related processes may still require access to a separate Moxie QuickBooks Online environment, and Moxie clients have a separate Track1099 login. Confirm the exact instructions and access details before publishing.</div>`};
const names={home:'Home',culture:'Our Culture',team:'Meet the Team',essentials:'Employee Essentials',learning:'Learning Hub',tools:'Tools & Resources',onboarding:'New Hire Corner'};
function navigate(p){document.getElementById('content').innerHTML=blocks[p]||blocks.home;document.getElementById('breadcrumb').textContent=names[p]||'Home';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));history.replaceState(null,'','#'+p);window.scrollTo({top:0,behavior:'instant'});let s=document.getElementById('teamsearch');if(s)s.addEventListener('input',()=>document.querySelectorAll('.person').forEach(c=>c.classList.toggle('hidden',!c.textContent.toLowerCase().includes(s.value.toLowerCase()))))}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-page]');if(btn)navigate(btn.dataset.page)});navigate(location.hash.slice(1)||'home');
</script></body></html>
